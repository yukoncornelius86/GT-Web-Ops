name: Sync Shared Site Navigation

# One-time rerun after image caching

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-auction-images.yml"

permissions:
  contents: write

jobs:
  sync-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild shared headers and footers
        run: python scripts/build-gt-public-chrome.py

      - name: Commit synchronized public pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/thegtcollective
          git diff --cached --quiet && exit 0
          git commit -m "Expose Auction Prep in public navigation"
          git push
