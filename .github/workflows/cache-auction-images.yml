name: Cache Auction Result Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-auction-images.yml"

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download approved auction hero images
        run: |
          set -euo pipefail
          mkdir -p sites/thegtcollective/assets/auction-results
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0"             "https://i0.wp.com/bringatrailer.com/wp-content/uploads/2026/09/1984_porsche_944_P94420Edits-136-39873-scaled-1-copy-2026-10-05-0se-39222.jpg?w=1600&ssl=1"             --output sites/thegtcollective/assets/auction-results/1984-porsche-944.jpg
          curl --fail --location --retry 3 --user-agent "Mozilla/5.0"             "https://i0.wp.com/bringatrailer.com/wp-content/uploads/2026/08/2002_ford_thunderbird_TBird20Edits202812920-20under2010MB-55165-scaled-1-copy-2026-09-08-khz-84770.jpg?w=1600&ssl=1"             --output sites/thegtcollective/assets/auction-results/2002-ford-thunderbird.jpg
          test -s sites/thegtcollective/assets/auction-results/1984-porsche-944.jpg
          test -s sites/thegtcollective/assets/auction-results/2002-ford-thunderbird.jpg

      - name: Commit cached images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/thegtcollective/assets/auction-results
          git diff --cached --quiet && exit 0
          git commit -m "Cache auction result hero images"
          git push
